<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>
  <!-- Neural node geometric icon -->
  <circle cx="256" cy="180" r="36" fill="url(#accent)"/>
  <circle cx="170" cy="310" r="28" fill="url(#accent)"/>
  <circle cx="342" cy="310" r="28" fill="url(#accent)"/>
  <!-- Connection lines -->
  <line x1="256" y1="180" x2="170" y2="310" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>
  <line x1="256" y1="180" x2="342" y2="310" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>
  <line x1="170" y1="310" x2="342" y2="310" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>
  <!-- Center pulse core -->
  <circle cx="256" cy="265" r="14" fill="#ffffff" opacity="0.9"/>
</svg>
